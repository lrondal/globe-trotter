<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:24px;background:var(--surface-page);color:var(--text-primary);font-family:var(--font-sans)}*{box-sizing:border-box}.row{display:flex;gap:12px;flex-wrap:wrap}.sw{display:flex;flex-direction:column;gap:6px;width:100px}.sw i{display:block;height:56px;border-radius:var(--radius-md);border:1px solid var(--border-default)}.sw b{font:var(--text-label)}.sw span{font:var(--text-caption);color:var(--text-muted)}.lab{font:var(--text-caption);color:var(--text-muted);font-variant-numeric:tabular-nums}</style></head><body><div style="display:grid;grid-template-columns:repeat(3,1fr);gap:16px"><div style="padding:14px;border:1px solid var(--border-default);border-radius:var(--radius-md);background:var(--surface-raised)"><div style="font:var(--text-display-s)">120ms</div><div class="lab">--dur-fast · Pression, survol</div></div><div style="padding:14px;border:1px solid var(--border-default);border-radius:var(--radius-md);background:var(--surface-raised)"><div style="font:var(--text-display-s)">220ms</div><div class="lab">--dur-base · Puces, bascules</div></div><div style="padding:14px;border:1px solid var(--border-default);border-radius:var(--radius-md);background:var(--surface-raised)"><div style="font:var(--text-display-s)">420ms</div><div class="lab">--dur-slow · Feuilles, vol du globe</div></div></div><div class="lab" style="margin-top:10px">--ease-out cubic-bezier(.2,.7,.2,1) · --ease-in-out cubic-bezier(.6,0,.3,1)</div></body></html>
