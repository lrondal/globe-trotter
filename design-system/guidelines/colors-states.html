<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:24px;background:var(--surface-page);color:var(--text-primary);font-family:var(--font-sans)}*{box-sizing:border-box}.row{display:flex;gap:12px;flex-wrap:wrap}.sw{display:flex;flex-direction:column;gap:6px;width:100px}.sw i{display:block;height:56px;border-radius:var(--radius-md);border:1px solid var(--border-default)}.sw b{font:var(--text-label)}.sw span{font:var(--text-caption);color:var(--text-muted)}.lab{font:var(--text-caption);color:var(--text-muted);font-variant-numeric:tabular-nums}</style></head><body><div class="row"><div class="sw"><i style="background:var(--state-visited)"></i><b>Visité</b><span>terracotta-500</span></div><div class="sw"><i style="background:var(--state-visited-tint)"></i><b>Visité tint</b><span>terracotta-100</span></div><div class="sw"><i style="background:var(--state-wish)"></i><b>À visiter</b><span>ochre-400</span></div><div class="sw"><i style="background:var(--state-wish-tint)"></i><b>À visiter tint</b><span>ochre-100</span></div><div class="sw"><i style="background:var(--state-unexplored)"></i><b>Non exploré</b><span>paper-3</span></div></div></body></html>
