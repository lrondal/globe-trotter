name: Release builds

# Builds an unsigned iOS .ipa (to sideload with SideStore and a free Apple ID)
# and an Android .apk. See docs/install-on-phone.md.
#
# - Push a tag `v*` (e.g. `v1.0.0`): both files are attached to a GitHub Release.
# - Run it by hand (Actions → Release builds → Run workflow): files are kept as run artifacts.
# - A pull request that edits this workflow builds both, to check the workflow still works.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
  pull_request:
    paths: ['.github/workflows/release.yml']

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  ios:
    name: iOS (.ipa, unsigned)
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Generate the native iOS project
        run: npx expo prebuild --platform ios --clean --no-install
      - name: Install CocoaPods
        working-directory: ios
        run: pod install
      - name: Build (Release, no code signing)
        run: |
          WORKSPACE=$(ls -d ios/*.xcworkspace | head -n 1)
          SCHEME=$(basename "$WORKSPACE" .xcworkspace)
          xcodebuild archive \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/App.xcarchive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            | tee build.log | grep -E '^(\*\*|error:|.*: error:)' || true
          test -d build/App.xcarchive/Products/Applications || { tail -n 200 build.log; exit 1; }
      - name: Package the .ipa
        run: |
          mkdir -p dist/Payload
          cp -R build/App.xcarchive/Products/Applications/*.app dist/Payload/
          (cd dist && zip -qry GlobeTrotter.ipa Payload)
          ls -lh dist/GlobeTrotter.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: GlobeTrotter-ios
          path: dist/GlobeTrotter.ipa
          if-no-files-found: error

  android:
    name: Android (.apk)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Generate the native Android project
        run: npx expo prebuild --platform android --clean --no-install
      # The generated project signs release builds with the debug.keystore that ships
      # in Expo's template: the same key on every build, so a new .apk installs over
      # the old one and keeps its data.
      - name: Build (release)
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon
      - run: cp android/app/build/outputs/apk/release/app-release.apk GlobeTrotter.apk
      - uses: actions/upload-artifact@v4
        with:
          name: GlobeTrotter-android
          path: GlobeTrotter.apk
          if-no-files-found: error

  release:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [ios, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            GlobeTrotter.ipa
            GlobeTrotter.apk
          generate_release_notes: true
