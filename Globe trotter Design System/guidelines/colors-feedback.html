<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:24px;background:var(--surface-page);color:var(--text-primary);font-family:var(--font-sans)}*{box-sizing:border-box}.row{display:flex;gap:12px;flex-wrap:wrap}.sw{display:flex;flex-direction:column;gap:6px;width:100px}.sw i{display:block;height:56px;border-radius:var(--radius-md);border:1px solid var(--border-default)}.sw b{font:var(--text-label)}.sw span{font:var(--text-caption);color:var(--text-muted)}.lab{font:var(--text-caption);color:var(--text-muted);font-variant-numeric:tabular-nums}</style></head><body><div class="row"><div class="sw"><i style="background:var(--sage-100)"></i><b>sage-100</b><span>#E3E8DD</span></div><div class="sw"><i style="background:var(--sage-600)"></i><b>sage-600</b><span>#5E7A5A</span></div><div class="sw"><i style="background:var(--brick-100)"></i><b>brick-100</b><span>#F2D9D5</span></div><div class="sw"><i style="background:var(--brick-600)"></i><b>brick-600</b><span>#B23A2E</span></div><div class="sw"><i style="background:var(--ochre-600)"></i><b>ochre-600</b><span>#B98A3E</span></div></div></body></html>
