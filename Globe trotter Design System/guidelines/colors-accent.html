<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:24px;background:var(--surface-page);color:var(--text-primary);font-family:var(--font-sans)}*{box-sizing:border-box}.row{display:flex;gap:12px;flex-wrap:wrap}.sw{display:flex;flex-direction:column;gap:6px;width:100px}.sw i{display:block;height:56px;border-radius:var(--radius-md);border:1px solid var(--border-default)}.sw b{font:var(--text-label)}.sw span{font:var(--text-caption);color:var(--text-muted)}.lab{font:var(--text-caption);color:var(--text-muted);font-variant-numeric:tabular-nums}</style></head><body><div class="row"><div class="sw"><i style="background:var(--terracotta-100)"></i><b>100</b><span>#F3DDD2</span></div><div class="sw"><i style="background:var(--terracotta-300)"></i><b>300</b><span>#DB8A69</span></div><div class="sw"><i style="background:var(--terracotta-500)"></i><b>500</b><span>#C4572E</span></div><div class="sw"><i style="background:var(--terracotta-600)"></i><b>600 hover</b><span>#A8461F</span></div><div class="sw"><i style="background:var(--terracotta-700)"></i><b>700 press</b><span>#8A3816</span></div></div></body></html>
