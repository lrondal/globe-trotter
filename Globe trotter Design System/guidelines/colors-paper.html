<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:24px;background:var(--surface-page);color:var(--text-primary);font-family:var(--font-sans)}*{box-sizing:border-box}.row{display:flex;gap:12px;flex-wrap:wrap}.sw{display:flex;flex-direction:column;gap:6px;width:100px}.sw i{display:block;height:56px;border-radius:var(--radius-md);border:1px solid var(--border-default)}.sw b{font:var(--text-label)}.sw span{font:var(--text-caption);color:var(--text-muted)}.lab{font:var(--text-caption);color:var(--text-muted);font-variant-numeric:tabular-nums}</style></head><body><div class="row"><div class="sw"><i style="background:var(--paper-0)"></i><b>paper-0</b><span>#FBF9F4</span></div><div class="sw"><i style="background:var(--paper-1)"></i><b>paper-1</b><span>#F4F1EA</span></div><div class="sw"><i style="background:var(--paper-2)"></i><b>paper-2</b><span>#ECE7DC</span></div><div class="sw"><i style="background:var(--paper-3)"></i><b>paper-3</b><span>#DCD5C6</span></div><div class="sw"><i style="background:var(--paper-4)"></i><b>paper-4</b><span>#D3CCBD</span></div><div class="sw"><i style="background:var(--paper-line)"></i><b>paper-line</b><span>#DDD7CA</span></div></div></body></html>
